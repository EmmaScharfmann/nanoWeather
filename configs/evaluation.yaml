data_config: configs/data.yaml
data_path: null  # defaults to output_dir of the data config
output_dir: results/evaluation
split: test

# 2020 initializations at 00 and 12 UTC, forecasts to 10 days
init_start: "2020-01-01T00"
init_end: "2020-12-31T12"
init_frequency_hours: 12
num_steps: 40
batch_size: 64

baselines: true  # persistence and climatology
acc_threshold: 0.6
summary_lead_hours: 72
plot_variables: [z500, t850, t2m]
