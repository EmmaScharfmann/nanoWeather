# Step 1 of the recipe: one-step training from scratch.
data_config: configs/data.yaml
data_path: null  # defaults to output_dir of the data config
output_dir: checkpoints/pretrain
push_to_hub: null

# Model: "vit" (patches of the latitude/longitude grid) or "mesh" (icosahedral mesh)
architecture: vit
patch_size: 2  # vit
mesh_refinement: 3  # mesh: 642 nodes
encoder_num_neighbors: 4  # mesh: nodes each grid point sends to
processor_num_neighbors: 16  # mesh: nodes each node attends to
decoder_num_neighbors: 4  # mesh: nodes each grid point reads from
dense_attention_max_pairs: 1000000  # mesh: full masked attention below this many pairs, see benchmark_models.py
hidden_size: 256
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 1024
num_input_steps: 1
use_time_features: false

# Loss
tendency_normalization: true
loss_weighting: pressure  # or uniform
surface_loss_weights: {t2m: 1.0, u10: 0.1, v10: 0.1, msl: 0.1}

# Training: one stage per entry of rollout_steps, the loss averaged over that many forecast steps
init_from: null
rollout_steps: [1]
num_train_epochs: 20  # per stage
batch_size: 32
eval_batch_size: 128
learning_rate: 5.0e-4
weight_decay: 0.05
warmup_steps: 1000
max_grad_norm: 1.0
bf16: true
compile: false
gradient_checkpointing: false

overfit_steps: 1000
logging_steps: 50
seed: 42
