# Step 2 of the recipe: fine-tuning on multi-step rollouts, from the model of step 1. Architecture, inputs and loss
# settings come from init_from.
base: configs/train/pretrain.yaml
output_dir: checkpoints/rollout
init_from: checkpoints/pretrain/best

rollout_steps: [2, 4, 8]
num_train_epochs: 1  # per stage
learning_rate: 1.0e-4
warmup_steps: 100
