[project]
name = "nanoweather"
version = "0.0.1"
description = "Train and evaluate small global weather forecasting models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "xarray>=2024.10",
    "zarr>=3.0",
    "fsspec>=2024.10",
    "aiohttp>=3.9",
    "requests>=2.31",
    "huggingface_hub>=0.26",
    "torch>=2.4",
    "safetensors>=0.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoweather"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "UP"]
ignore = ["C901", "E501", "E741", "F402", "F823"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["nanoweather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
